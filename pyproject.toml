[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsegregation"
version = "0.1.0"
description = "Point-cloud segregation and pipe geometry estimation"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "scipy>=1.8"]

[project.scripts]
deepsegregation = "deepsegregation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
